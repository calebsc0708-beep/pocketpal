name: Build IPA

on:
  push:
  workflow_dispatch:

# A newer push cancels an older build that's still running or waiting.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build animation fonts
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q fonttools pillow
          .venv/bin/python tools/build_pals.py
          .venv/bin/python tools/make_fonts.py
          .venv/bin/python tools/build_room_fonts.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild \
            -project PocketPal.xcodeproj \
            -scheme PocketPal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -solver-expression-time-threshold=30 -Xfrontend -warn-long-expression-type-checking=1000' \
            build 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          # turn compiler errors into annotations so they show on the run page
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          # lines the compiler was slow on (helps find a build that hangs)
          grep -E "type-check|took [0-9]+ms" build.log | sort -u | head -20 | while IFS= read -r line; do
            echo "::warning::${line}"
          done

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PocketPal.app Payload/
          zip -qry PocketPal.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PocketPal-ipa
          path: PocketPal.ipa
