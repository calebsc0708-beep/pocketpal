name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build animation fonts
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q fonttools pillow
          .venv/bin/python tools/make_fonts.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project PocketPal.xcodeproj \
            -scheme PocketPal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PocketPal.app Payload/
          zip -qry PocketPal.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PocketPal-ipa
          path: PocketPal.ipa
