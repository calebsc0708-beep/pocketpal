name: Stream Deck plugin

on:
  push:
    branches: [main]
    paths: ["streamdeck/**", "desktop/prepare_assets.py", "Pals/**", "Sprites/**", ".github/workflows/streamdeck.yml"]
  workflow_dispatch:

concurrency:
  group: streamdeck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: streamdeck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Render key frames
        run: |
          pip install -q pillow numpy
          python prepare_frames.py
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Package (validates the manifest too)
        run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: PokePal-streamdeck
          path: streamdeck/dist/com.calebsc.pokepal.streamDeckPlugin
