name: PocketPal
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  PocketPal:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Pal
      - PalGen      # made by tools/build_pals.py from the Pals folder
      - path: Generated/Sprites
        type: folder
      - path: Generated/Fonts
        type: folder
    info:
      path: Support/App-Info.plist
      properties:
        CFBundleDisplayName: PokePal
        UILaunchScreen: {}
        UIAppFonts: [PixelifySans-Regular.ttf, PixelifySans-Bold.ttf]
        NSLocationWhenInUseUsageDescription: "PokePal uses your rough location to match the room's weather and sunrise/sunset to where you are."
        NSSupportsLiveActivities: true
        # SideStore renames app groups on install and writes the real names here
        ALTAppGroups: [group.com.yourname.pocketpal]
        NSPhotoLibraryAddUsageDescription: Save your sprites to Photos.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.pocketpal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PocketPalWidget
    scheme: {}
  PocketPalWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      # the room widget reuses these from the app
      - PalGen
      - Pal/PalActivity.swift
      - Pal/PalRoomAmbience.swift
      - Pal/PalRoomView.swift
      - Pal/RoomDecorations.swift
      - Pal/DecoFrames.swift
      - Pal/RoomLook.swift
      - Pal/WeatherSync.swift
      - Pal/PalSprites.xcassets
      - path: Generated/Sprites
        type: folder
      - path: Generated/Fonts
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.pocketpal.widget
        # Generated by tools/build_sprites.py (registers the frame fonts)
        INFOPLIST_FILE: Support/Widget-Info.plist
