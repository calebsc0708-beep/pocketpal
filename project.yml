name: PocketPal
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  PocketPal:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Sprites
        type: folder
      - path: Fonts
        type: folder
    info:
      path: Support/App-Info.plist
      properties:
        CFBundleDisplayName: Pocket Pal
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.pocketpal
    dependencies:
      - target: PocketPalWidget
    scheme: {}
  PocketPalWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: Sprites
        type: folder
      - path: Fonts
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.pocketpal.widget
        # Generated by tools/make_fonts.py (registers the frame fonts)
        INFOPLIST_FILE: Support/Widget-Info.plist
