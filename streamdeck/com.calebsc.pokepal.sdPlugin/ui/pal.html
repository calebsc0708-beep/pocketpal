<!doctype html>
<html>
	<head lang="en">
		<title>PokePal</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Pal">
			<sdpi-select setting="pal" default="eevee">
				<option value="eevee">Eevee</option>
				<option value="pikachu">Pikachu</option>
				<option value="minccino">Minccino</option>
				<option value="absol">Absol</option>
				<option value="alolanvulpix">Alolan Vulpix</option>
				<option value="mew">Mew</option>
				<option value="rei_chibi">Rei</option>
				<option value="rockruff">Rockruff</option>
				<option value="sylveon">Sylveon</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Background">
			<sdpi-select setting="background" default="room">
				<option value="room">Room (follows time of day)</option>
				<option value="dark">Dark</option>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>
